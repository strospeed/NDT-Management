<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDT Pro | Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-500">
    <!-- ... existing code ... -->
    <div id="login-screen" class="fixed inset-0 z-[200] bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">Login NDT Pro</h2>
            <input type="password" id="password-input" placeholder="Masukkan Kata Sandi" class="w-full p-4 mb-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- Pastikan tombol ini memanggil fungsi yang benar -->
            <button onclick="checkLogin()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-semibold hover:bg-indigo-700 active:scale-95 transition-all">Masuk</button>
            <p id="login-error" class="text-rose-500 text-sm mt-4 text-center hidden">Kata sandi salah!</p>
        </div>
    </div>
    <!-- ... existing code ... -->
    
    <!-- PENTING: Tempatkan script di sini, setelah elemen HTML dimuat -->
    <script src="script.js"></script>
</body>
</html>
