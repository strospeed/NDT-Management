<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-NDT Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(30, 41, 59, 0.8); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">NDT System Access</h2>
            <input type="password" id="pass-input" placeholder="Enter password (admin)" class="w-full p-4 mb-4 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-blue-600">
            <button onclick="handleLogin()" class="w-full p-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Access System</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-ui" class="hidden min-h-screen flex">
        <aside class="w-64 border-r border-slate-200 dark:border-slate-800 p-8 flex flex-col hidden lg:flex">
            <div class="text-xl font-bold mb-12 italic">PRO-NDT</div>
            <nav class="space-y-4">
                <button class="w-full text-left p-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-semibold">Dashboard</button>
                <button class="w-full text-left p-3 hover:text-blue-600 font-semibold">Inspector List</button>
                <button class="w-full text-left p-3 hover:text-blue-600 font-semibold">Equipment Logs</button>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-10">
                <h1 class="text-2xl font-bold">Inspection Overview</h1>
                <div class="flex gap-3">
                    <button onclick="toggleTheme()" class="px-4 py-2 border rounded-xl">Theme</button>
                    <button onclick="openModal()" class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold">+ New Entry</button>
                </div>
            </header>

            <div class="grid grid-cols-3 gap-6 mb-8">
                <div class="p-6 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
                    <p class="text-sm text-slate-500">Total Projects</p>
                    <h2 id="total-stat" class="text-3xl font-bold">0</h2>
                </div>
                <div class="p-6 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
                    <p class="text-sm text-slate-500">In Progress</p>
                    <h2 id="process-stat" class="text-3xl font-bold text-amber-600">0</h2>
                </div>
                <div class="p-6 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
                    <p class="text-sm text-slate-500">Completed</p>
                    <h2 id="done-stat" class="text-3xl font-bold text-emerald-600">0</h2>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border shadow-sm overflow-hidden">
                <div class="p-6 border-b flex justify-between">
                    <input type="text" id="search-bar" oninput="renderData()" placeholder="Search client..." class="px-4 py-2 border rounded-xl dark:bg-slate-800">
                    <button onclick="exportData()" class="text-blue-600 font-medium">Export CSV</button>
                </div>
                <table class="w-full">
                    <thead class="bg-slate-50 dark:bg-slate-800 text-xs font-bold uppercase text-slate-500">
                        <tr><th class="px-6 py-4">Client</th><th class="px-6 py-4">Method</th><th class="px-6 py-4">Status</th><th class="px-6 py-4 text-right">Actions</th></tr>
                    </thead>
                    <tbody id="table-content" class="divide-y"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm p-8 rounded-3xl border">
            <h2 class="text-xl font-bold mb-4">Add Inspection Data</h2>
            <form id="data-form" class="space-y-4">
                <input type="text" id="client" placeholder="Client Name" required class="w-full p-3 border rounded-xl dark:bg-slate-800">
                <select id="method" class="w-full p-3 border rounded-xl dark:bg-slate-800">
                    <option>Ultrasonic Testing</option><option>Radiography</option><option>Magnetic Particle</option>
                </select>
                <div class="flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 border rounded-xl">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ndt_db')) || [];

        function handleLogin() {
            if(document.getElementById('pass-input').value === 'admin') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                renderData();
            } else { alert('Incorrect Password'); }
        }

        function renderData() {
            const tbody = document.getElementById('table-content');
            const filter = document.getElementById('search-bar').value.toLowerCase();
            const filtered = db.filter(d => d.client.toLowerCase().includes(filter));
            
            tbody.innerHTML = filtered.map((d, i) => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800">
                    <td class="px-6 py-4">${d.client}</td>
                    <td class="px-6 py-4 text-slate-500">${d.method}</td>
                    <td class="px-6 py-4">
                        <button onclick="toggleStatus(${i})" class="px-3 py-1 rounded-full text-xs font-bold ${d.status === 'In Progress' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${d.status}</button>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteItem(${i})" class="text-rose-500 font-bold">Delete</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('total-stat').innerText = db.length;
            document.getElementById('process-stat').innerText = db.filter(d => d.status === 'In Progress').length;
            document.getElementById('done-stat').innerText = db.filter(d => d.status === 'Completed').length;
            localStorage.setItem('ndt_db', JSON.stringify(db));
        }

        document.getElementById('data-form').onsubmit = (e) => {
            e.preventDefault();
            db.push({ client: document.getElementById('client').value, method: document.getElementById('method').value, status: 'In Progress' });
            closeModal(); renderData(); e.target.reset();
        };

        function toggleStatus(i) { db[i].status = db[i].status === 'In Progress' ? 'Completed' : 'In Progress'; renderData(); }
        function deleteItem(i) { if(confirm('Confirm delete?')) { db.splice(i, 1); renderData(); } }
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function exportData() {
            const csv = 'Client,Method,Status\n' + db.map(d => `${d.client},${d.method},${d.status}`).join('\n');
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inspection_report.csv'; a.click();
        }
    </script>
</body>
</html>
