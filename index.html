<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDT Pro | Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- LOGIN OVERLAY -->
    <div id="login-screen" class="fixed inset-0 z-[1000] bg-slate-50 dark:bg-slate-950 flex items-center justify-center">
        <div class="w-full max-w-sm p-8 bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800">
            <h2 class="text-2xl font-bold mb-6 text-center">🔐 Akses Sistem</h2>
            <input type="password" id="pass" placeholder="Masukkan Password Admin" class="w-full p-4 mb-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="login()" class="w-full p-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Masuk</button>
        </div>
    </div>

    <div id="main-app" class="hidden flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 border-r border-slate-200 dark:border-slate-800 p-6 hidden md:flex flex-col">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">N</div>
                <h1 class="text-lg font-black">NDT PRO</h1>
            </div>
            <nav class="space-y-4">
                <a href="#" class="block p-3 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 rounded-xl font-semibold">📊 Dashboard</a>
                <a href="#" class="block p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-semibold">📋 Inspeksi</a>
                <a href="#" class="block p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-semibold">⚙️ Pengaturan</a>
            </nav>
            <div class="mt-auto bg-slate-100 dark:bg-slate-800 p-4 rounded-2xl text-xs text-slate-500">System v3.0 Build 2026</div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black">Dashboard</h2>
                <div class="flex gap-3">
                    <button id="theme-btn" class="p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">🌓</button>
                    <button onclick="openModal()" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">+ Order Baru</button>
                </div>
            </header>

            <!-- STATS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800">
                    <p class="text-xs font-bold text-slate-400">TOTAL</p>
                    <h3 id="stat-total" class="text-4xl font-black mt-2">0</h3>
                </div>
                <div class="p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 border-l-4 border-l-amber-500">
                    <p class="text-xs font-bold text-amber-600">PROSES</p>
                    <h3 id="stat-proses" class="text-4xl font-black mt-2 text-amber-600">0</h3>
                </div>
                <div class="p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 border-l-4 border-l-emerald-500">
                    <p class="text-xs font-bold text-emerald-600">SELESAI</p>
                    <h3 id="stat-done" class="text-4xl font-black mt-2 text-emerald-600">0</h3>
                </div>
            </div>

            <!-- TABLE -->
            <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between">
                    <input type="text" id="search" oninput="render()" placeholder="Cari klien..." class="p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 outline-none">
                    <button onclick="exportCSV()" class="text-sm font-bold text-indigo-600">Export CSV</button>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 text-xs uppercase font-bold">
                        <tr><th class="px-8 py-4">Klien</th><th class="px-8 py-4">Metode</th><th class="px-8 py-4">Status</th><th class="px-8 py-4">Aksi</th></tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[500]">
        <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-8 rounded-3xl">
            <h3 class="text-xl font-bold mb-6">Tambah Order</h3>
            <form id="order-form" class="space-y-4">
                <input type="text" id="client" required placeholder="Nama Klien" class="w-full p-4 rounded-xl border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 outline-none">
                <select id="method" class="w-full p-4 rounded-xl border bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 outline-none">
                    <option>Ultrasonic (UT)</option><option>Radiography (RT)</option><option>Magnetic Particle (MT)</option>
                    <option>Liquid Penetrant (PT)</option>
                </select>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('ndt_orders')) || [];

        function login() { if(document.getElementById('pass').value === 'admin') { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden'); } }

        function render() {
            const query = document.getElementById('search').value.toLowerCase();
            const body = document.getElementById('table-body');
            const filtered = orders.filter(o => o.client.toLowerCase().includes(query));
            body.innerHTML = filtered.map((o, i) => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                    <td class="px-8 py-5 font-bold">${o.client}</td>
                    <td class="px-8 py-5 text-slate-500">${o.method}</td>
                    <td class="px-8 py-5">
                        <button onclick="toggle(${i})" class="px-3 py-1 rounded-full text-xs font-bold ${o.status === 'Proses' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${o.status}</button>
                    </td>
                    <td class="px-8 py-5"><button onclick="del(${i})" class="text-rose-500 text-sm font-semibold hover:underline">Hapus</button></td>
                </tr>`).join('');
            document.getElementById('stat-total').innerText = orders.length;
            document.getElementById('stat-proses').innerText = orders.filter(o => o.status === 'Proses').length;
            document.getElementById('stat-done').innerText = orders.filter(o => o.status === 'Selesai').length;
            localStorage.setItem('ndt_orders', JSON.stringify(orders));
        }

        document.getElementById('order-form').onsubmit = (e) => { e.preventDefault(); orders.push({ client: document.getElementById('client').value, method: document.getElementById('method').value, status: 'Proses' }); closeModal(); render(); };
        function toggle(i) { orders[i].status = orders[i].status === 'Proses' ? 'Selesai' : 'Proses'; render(); }
        function del(i) { orders.splice(i, 1); render(); }
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        document.getElementById('theme-btn').onclick = () => document.documentElement.classList.toggle('dark');
        
        function exportCSV() {
            let csv = 'Klien,Metode,Status\n' + orders.map(o => `${o.client},${o.method},${o.status}`).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', 'data_ndt.csv'); a.click();
        }
        render();
    </script>
</body>
</html>
